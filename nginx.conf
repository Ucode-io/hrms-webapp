server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Имена файлов в assets/ содержат хеш содержимого — они неизменяемы, и
    # перевыкатка меняет имя, а не содержимое. Кэшируем навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html — наоборот, всегда свежий: в нём лежат имена бандлов. Без
    # Cache-Control вебвью Telegram кэшировал его эвристически (по Last-Modified,
    # своего заголовка не было вовсе) и после выката ещё сутками грузил старый
    # бандл: деплой проходил, а на телефоне оставалась прежняя версия.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
